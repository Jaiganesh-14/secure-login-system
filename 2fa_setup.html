{% extends "base.html" %}
{% block title %}Set Up 2FA — Secure Login System{% endblock %}
{% block content %}
<div class="card">
    <h1>Set Up Two-Factor Authentication</h1>
    <p>Scan this QR code with an authenticator app (Google Authenticator, Authy, etc.):</p>

    <img src="data:image/png;base64,{{ qr_base64 }}" alt="2FA QR Code" class="qr-code">

    <p class="hint">Or enter this code manually: <code>{{ secret }}</code></p>

    <form method="POST" action="{{ url_for('setup_2fa') }}">
        <label for="code">Enter the 6-digit code from your app</label>
        <input type="text" id="code" name="code" required pattern="\d{6}" maxlength="6" inputmode="numeric">
        <button type="submit">Verify & Enable 2FA</button>
    </form>

    <p class="switch-link"><a href="{{ url_for('dashboard') }}">Cancel</a></p>
</div>
{% endblock %}
