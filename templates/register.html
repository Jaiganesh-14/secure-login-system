{% extends "base.html" %}
{% block title %}Register — Secure Login System{% endblock %}
{% block content %}
<div class="card">
    <h1>Create Account</h1>
    <form method="POST" action="{{ url_for('register') }}" autocomplete="off">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required
               pattern="[a-zA-Z0-9_]{3,20}" maxlength="20"
               title="3-20 characters: letters, numbers, underscore only">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="120">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="8">
        <small class="hint">Min 8 characters, with uppercase, lowercase, number, and symbol.</small>

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8">

        <button type="submit">Create Account</button>
    </form>
    <p class="switch-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}
